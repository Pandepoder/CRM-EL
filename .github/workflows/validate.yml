name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install
      - run: pnpm validate:unit

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tonala
          POSTGRES_PASSWORD: tonala_dev_password
          POSTGRES_DB: tonala_os
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U tonala -d tonala_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tonala:tonala_dev_password@localhost:54329/tonala_os
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "54329"
      POSTGRES_DB: tonala_os
      POSTGRES_USER: tonala
      POSTGRES_PASSWORD: tonala_dev_password
      NEXT_PUBLIC_APP_NAME: Tonala OS
      NEXT_PUBLIC_APP_ENV: test
      SESSION_SECRET: ci-test-session-secret-at-least-32-chars
      DEMO_PASSWORD: TonalaDemo2026
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test:integration
