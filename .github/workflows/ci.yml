name: CI Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tonala_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/tonala_os_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: tonala_os_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      NEXT_PUBLIC_APP_NAME: Tonala OS
      NEXT_PUBLIC_APP_ENV: test
      # Tiene que estar definida con un valor, no solo ausente: Next.js sustituye
      # las NEXT_PUBLIC_* al compilar y solo elimina el bloque de acceso demo si la
      # condicion es constante. Sin definirla, el bloque sobrevive al minificador y
      # acaba en el JavaScript que descarga el navegador.
      NEXT_PUBLIC_ENABLE_DEMO_LOGIN: "false"
      NEXT_PUBLIC_DEMO_PASSWORD: ""
      SESSION_SECRET: ci-test-session-secret-at-least-32-chars
      DATABASE_ENCRYPTION_KEY: tonala-ci-encryption-key-32-chars-long!
      # Valor de usar y tirar para la base efimera de CI. No corresponde a
      # ninguna cuenta real y no debe reutilizarse fuera de este workflow.
      DEMO_PASSWORD: ci-solo-para-pruebas-5adb20d70ae908fb

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Las pruebas que tocan la base necesitan el esquema y el catalogo de
      # roles. database.test.ts crea ademas su propia base aparte, asi que
      # sembrar esta no le estorba.
      - name: Preparar la base de pruebas
        run: |
          pnpm db:migrate
          pnpm db:seed

      # Antes esto era `validate:unit`, que excluye todo lo que toca la base de
      # datos: el servicio de Postgres de arriba estaba levantado y sin usar.
      # Por eso cinco pruebas de integracion llevaban tiempo en rojo sin que
      # nadie se enterara, y por eso `test:integration` podia ejecutar 1 de 12
      # archivos sin que se notara.
      - name: Validación (tipos, lint, arquitectura y TODAS las pruebas)
        run: pnpm validate

      # El despliegue construye la imagen, asi que un fallo de build tumbaba la
      # publicacion en vez de detectarse en el PR. `validate` no lo cubre: hace
      # typecheck, no compilacion de Next.
      - name: Compilación de producción
        run: pnpm web:build

      # El artefacto compilado es el unico sitio donde se puede comprobar esto:
      # Next.js sustituye las NEXT_PUBLIC_* al compilar, asi que el .env o el
      # Dockerfile dicen con que intencion se construyo, no que quedo dentro del
      # JavaScript que descarga el navegador.
      - name: Verificar que el bundle no lleva el acceso demo
        run: pnpm check:bundle-secrets
