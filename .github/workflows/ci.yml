name: CI Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tonala_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/tonala_os_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: tonala_os_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      NEXT_PUBLIC_APP_NAME: Tonala OS
      NEXT_PUBLIC_APP_ENV: test
      SESSION_SECRET: ci-test-session-secret-at-least-32-chars
      DATABASE_ENCRYPTION_KEY: tonala-ci-encryption-key-32-chars-long!
      DEMO_PASSWORD: TonalaDemo2026

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Validation (Typecheck, Lint, Architecture, Unit Tests)
        run: pnpm validate:unit
