services:
  db:
    image: postgres:16-alpine
    container_name: tonala-os-postgres
    ports:
      - "54329:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tonala_os}
      POSTGRES_USER: ${POSTGRES_USER:-tonala}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tonala_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-tonala} -d $${POSTGRES_DB:-tonala_os}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - tonala_os_postgres_data:/var/lib/postgresql/data

  # One-off job: applies pending Drizzle migrations, then exits. "web" and
  # "outbox-worker" wait for this to finish successfully before starting, so
  # the app never serves traffic against an unmigrated schema (see README).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: tonala-os-migrate
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-tonala}:${POSTGRES_PASSWORD:-tonala_dev_password}@db:5432/${POSTGRES_DB:-tonala_os}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-tonala_os}
      - POSTGRES_USER=${POSTGRES_USER:-tonala}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tonala_dev_password}
    command: ["pnpm", "db:migrate"]
    restart: "no"

  # Polls the transactional outbox continuously so queued events (contact
  # creation, visits, etc.) are actually delivered without a human running
  # `pnpm outbox:run-once` by hand.
  outbox-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: tonala-os-outbox-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-tonala}:${POSTGRES_PASSWORD:-tonala_dev_password}@db:5432/${POSTGRES_DB:-tonala_os}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-tonala_os}
      - POSTGRES_USER=${POSTGRES_USER:-tonala}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tonala_dev_password}
    entrypoint: ["sh", "-c", "while true; do pnpm outbox:run-once; sleep ${OUTBOX_POLL_INTERVAL_SECONDS:-10}; done"]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tonala-os-web
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-tonala}:${POSTGRES_PASSWORD:-tonala_dev_password}@db:5432/${POSTGRES_DB:-tonala_os}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-tonala_os}
      - POSTGRES_USER=${POSTGRES_USER:-tonala}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tonala_dev_password}
      - ALLOW_PUBLIC_REGISTRATION=${ALLOW_PUBLIC_REGISTRATION:-false}
      - SESSION_SECRET=${SESSION_SECRET}
      - DATABASE_ENCRYPTION_KEY=${DATABASE_ENCRYPTION_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@elapp.com.mx}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DEMO_PASSWORD=${DEMO_PASSWORD}
      - NEXT_PUBLIC_ENABLE_DEMO_LOGIN=${NEXT_PUBLIC_ENABLE_DEMO_LOGIN:-false}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-Tonala OS}
      - NEXT_PUBLIC_APP_ENV=production
      - PORT=3000
    # /api/upload escribe en `process.cwd()/public/uploads` y cwd es /app.
    # Sin este volumen las fotos y videos de incidencias viven solo dentro del
    # contenedor y desaparecen en cada `docker compose up --build`.
    volumes:
      - tonala_os_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Respaldo periódico de la base. Escribe un dump comprimido por ciclo y poda
  # los más viejos que BACKUP_RETENTION_DAYS.
  # PENDIENTE: estas copias quedan EN EL MISMO VPS. Para que sirvan ante pérdida
  # del disco hay que replicarlas fuera (S3, rclone, scp a otra máquina).
  backup:
    image: postgres:16-alpine
    container_name: tonala-os-backup
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:-tonala_dev_password}
      - POSTGRES_USER=${POSTGRES_USER:-tonala}
      - POSTGRES_DB=${POSTGRES_DB:-tonala_os}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - tonala_os_backups:/backups
      - ./scripts/ops/backup.sh:/usr/local/bin/backup.sh:ro
      - ./scripts/ops/restore.sh:/usr/local/bin/restore.sh:ro
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    restart: unless-stopped

  caddy:
    image: caddy:2.7-alpine
    container_name: tonala-os-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  tonala_os_postgres_data:
  tonala_os_uploads:
  tonala_os_backups:
  caddy_data:
  caddy_config:
