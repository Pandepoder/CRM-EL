services:
  db:
    image: postgres:16-alpine
    container_name: tonala-os-postgres
    # Atado a la interfaz local a proposito. Con "54329:5432" Docker publica en
    # todas las interfaces, asi que en el VPS la base con el padron ciudadano
    # queda escuchando a internet detras de una sola contrasena. El contenedor
    # "web" no usa este puerto —llega por la red interna de compose, a db:5432—,
    # asi que solo sirve para conectarse desde la propia maquina: en local sigue
    # funcionando igual, y en el servidor se alcanza por tunel SSH.
    #
    # Cuidado: un firewall no sustituye esta linea. Docker escribe sus reglas en
    # la cadena DOCKER-USER, que se evalua antes que las de ufw, y un
    # "ufw deny 54329" no cierra un puerto publicado.
    ports:
      - "127.0.0.1:54329:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tonala_os}
      POSTGRES_USER: ${POSTGRES_USER:-tonala}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tonala_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-tonala} -d $${POSTGRES_DB:-tonala_os}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - tonala_os_postgres_data:/var/lib/postgresql/data
    # Era el unico servicio sin politica de reinicio. Al reiniciar el servidor
    # volvian web, outbox-worker, caddy y backup, pero la base no: la aplicacion
    # quedaba en pie respondiendo "Database connection failed" en cada ruta, y
    # el sitio caido sin que ningun contenedor apareciera como fallido.
    restart: unless-stopped

  # One-off job: applies pending Drizzle migrations, then exits. "web" and
  # "outbox-worker" wait for this to finish successfully before starting, so
  # the app never serves traffic against an unmigrated schema (see README).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: tonala-os-migrate
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-tonala}:${POSTGRES_PASSWORD:-tonala_dev_password}@db:5432/${POSTGRES_DB:-tonala_os}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-tonala_os}
      - POSTGRES_USER=${POSTGRES_USER:-tonala}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tonala_dev_password}
      - TZ=America/Mexico_City
    command: ["pnpm", "db:migrate"]
    restart: "no"

  # Polls the transactional outbox continuously so queued events (contact
  # creation, visits, etc.) are actually delivered without a human running
  # `pnpm outbox:run-once` by hand.
  outbox-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: tonala-os-outbox-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-tonala}:${POSTGRES_PASSWORD:-tonala_dev_password}@db:5432/${POSTGRES_DB:-tonala_os}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-tonala_os}
      - POSTGRES_USER=${POSTGRES_USER:-tonala}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tonala_dev_password}
      - TZ=America/Mexico_City
    entrypoint: ["sh", "-c", "while true; do pnpm outbox:run-once; sleep ${OUTBOX_POLL_INTERVAL_SECONDS:-10}; done"]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tonala-os-web
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-tonala}:${POSTGRES_PASSWORD:-tonala_dev_password}@db:5432/${POSTGRES_DB:-tonala_os}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-tonala_os}
      - POSTGRES_USER=${POSTGRES_USER:-tonala}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tonala_dev_password}
      # La hora de Jalisco, no la del contenedor (UTC). Las pantallas se dibujan primero en el
      # servidor y luego en el teléfono: con UTC, cada fecha u hora sin zona explícita salía distinta
      # en uno y otro, y React tiraba el error #418 y volvía a dibujar la página (comprobado en el
      # ensayo de despliegue, 2026-09-26: 21 pantallas). Solo cambia la hora local del proceso: las
      # columnas de fecha son todas `timestamptz` y los nacimientos se guardan y leen en UTC.
      # Jalisco no tiene horario de verano desde 2022.
      - TZ=America/Mexico_City
      - ALLOW_PUBLIC_REGISTRATION=${ALLOW_PUBLIC_REGISTRATION:-false}
      - SESSION_SECRET=${SESSION_SECRET}
      - DATABASE_ENCRYPTION_KEY=${DATABASE_ENCRYPTION_KEY}
      # Sin valor por omisión: la identidad del Administrador Maestro debe venir del .env
      # y de un solo sitio. Con el `:-admin@elapp.com.mx` que había aquí, esa cuenta
      # cambiaba según cómo se ejecutara `pnpm db:clean` (este archivo traía un correo,
      # .env.example otro y .env.production.example un tercero). Si falta, `db:clean`
      # aborta con un mensaje claro en vez de crear un administrador que nadie esperaba.
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-Jalisco OS}
      - NEXT_PUBLIC_APP_ENV=production
      # Canal del que la página "Conóceme" toma los videos. Vacío = el de la campaña.
      - YOUTUBE_CANAL_ID=${YOUTUBE_CANAL_ID:-}
      - YOUTUBE_VIDEOS_OCULTOS=${YOUTUBE_VIDEOS_OCULTOS:-}
      - PORT=3000
    # /api/upload escribe en `process.cwd()/public/uploads` y cwd es /app.
    # Sin este volumen las fotos y videos de incidencias viven solo dentro del
    # contenedor y desaparecen en cada `docker compose up --build`.
    volumes:
      - tonala_os_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Respaldo periódico de la base. Escribe un dump comprimido por ciclo y poda
  # los más viejos que BACKUP_RETENTION_DAYS (solo tras un volcado bueno).
  # PENDIENTE (pospuesto a propósito, 2026-09-23): estas copias quedan EN EL
  # MISMO VPS. Sirven ante un borrado accidental, no ante la pérdida del disco o
  # del servidor. Falta elegir destino fuera (otro servidor, S3, Backblaze B2,
  # Google Drive…) y sus credenciales; con eso, la réplica es otro servicio aquí
  # que copie /backups y el volumen tonala_os_uploads. La llave de cifrado nunca
  # va a ese mismo destino. Ver R12 en docs/PLAN_ADMIN_MUNICIPAL.md.
  backup:
    image: postgres:16-alpine
    container_name: tonala-os-backup
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:-tonala_dev_password}
      - POSTGRES_USER=${POSTGRES_USER:-tonala}
      - POSTGRES_DB=${POSTGRES_DB:-tonala_os}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - tonala_os_backups:/backups
      - ./scripts/ops/backup.sh:/usr/local/bin/backup.sh:ro
      - ./scripts/ops/restore.sh:/usr/local/bin/restore.sh:ro
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    restart: unless-stopped

  caddy:
    image: caddy:2.7-alpine
    container_name: tonala-os-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  tonala_os_postgres_data:
  tonala_os_uploads:
  tonala_os_backups:
  caddy_data:
  caddy_config:
