services:
  db:
    image: postgres:16-alpine
    container_name: tonala-os-postgres
    ports:
      - "54329:5432"
    environment:
      POSTGRES_DB: tonala_os
      POSTGRES_USER: tonala
      POSTGRES_PASSWORD: tonala_dev_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tonala -d tonala_os"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - tonala_os_postgres_data:/var/lib/postgresql/data

volumes:
  tonala_os_postgres_data:
